<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>NEURO-TERMINAL RPG</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt-overlay"></div>
  <main id="terminal">
    <header id="status-bar">
      <span id="stat-charge">⚡ 100</span>
      <span id="stat-wisdom">🧠 0</span>
      <span id="stat-credits">💳 0</span>
      <span id="stat-level">📊 LVL 1</span>
    </header>
    <div id="screen-output"></div>
    <div id="input-area">
      <span class="prompt">> </span><input type="text" id="cmd-input" autocomplete="off" placeholder="RUN, BASE, LORE, SAVE...">
    </div>
    <nav id="choices-container"></nav>
    <footer id="terminal-log"></footer>
  </main>

  <!-- Templates (hidden) -->
  <template id="tmpl-choice">
    <button class="choice-btn" tabindex="0"></button>
  </template>

  <script src="js/utils.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/lore.js"></script>
  <script src="js/game.js"></script>
  <script src="js/core.js"></script>
</body>
</html>
