<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NEURO-TERMINAL RPG</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt-overlay"></div>
  <main id="terminal">
    <header id="status-bar">
      <span id="stat-charge">CHG:100</span>
      <span id="stat-wisdom">WIS:0</span>
      <span id="stat-credits">CRD:0</span>
      <span id="stat-level">LVL:1</span>
    </header>
    <div id="screen-output"></div>
    <div id="input-area">
      <span class="prompt">&gt;</span>
      <input type="text" id="cmd-input" autocomplete="off" autocapitalize="none" placeholder="COMMAND...">
    </div>
  </main>

  <script type="module" src="js/core.js"></script>
</body>
</html>
