<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ARCHIVE://DESCENT</title>
  <style>
    :root {
      --bg: #f4f7f6; --surface: #ffffff; --text: #1a2a3a; --text-dim: #667788;
      --accent: #007bff; --danger: #e63946; --lore: #00b4d8; --success: #2a9d8f;
      --wall: #e0e5ec; --visited: #eef4f8; --fog: #f8f9fa;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; outline: none; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #app { flex: 1; display: flex; flex-direction: column; padding: 1rem; overflow: hidden; }
    .screen { display: none; flex: 1; flex-direction: column; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 1rem; margin-bottom: 1rem; overflow: hidden; position: relative; }
    .screen.active { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    /* DESKTOP */
    #desktop { justify-content: center; align-items: center; gap: 1.5rem; }
    #desktop-stats { position: absolute; top: 1rem; left: 1rem; font-size: 0.9rem; font-weight: 600; color: var(--text-dim); background: var(--surface); padding: 0.5rem 1rem; border-radius: 8px; box-shadow: var(--shadow); }
    .icon { width: 140px; height: 100px; background: var(--surface); border: 1px solid #e1e8ed; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); }
    .icon:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,123,255,0.15); }
    .icon-label { margin-top: 0.5rem; font-size: 0.9rem; font-weight: 500; color: var(--text-dim); }
    .icon-title { font-weight: bold; color: var(--accent); font-size: 1.1rem; }
    .settings-btn { position: absolute; top: 1rem; right: 1rem; background: var(--surface); border: 1px solid #e1e8ed; border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; font-size: 0.9rem; box-shadow: var(--shadow); }

    /* GRID */
    #grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; padding: 0.5rem; background: #f8f9fa; border-radius: 8px; font-size: 0.85rem; }
    #objective-tracker { color: var(--accent); font-weight: 600; flex: 1; margin-left: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #grid-wrapper { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 0.5rem; }
    #grid-container { display: grid; gap: 3px; user-select: none; background: #e9ecef; padding: 3px; border-radius: 4px; }
    .cell { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; border-radius: 4px; transition: all 0.15s; background: var(--surface); }
    .cell.path { border: 1px solid #dee2e6; color: #adb5bd; }
    .cell.wall { background: var(--wall); border: 1px solid #ced4da; cursor: not-allowed; color: #ced4da; }
    .cell.visited { background: var(--visited); border-color: var(--accent); }
    .cell.current { background: var(--accent); color: white; box-shadow: 0 0 10px rgba(0,123,255,0.4); transform: scale(1.1); z-index: 2; }
    .cell.exit { border: 2px solid var(--success); color: var(--success); background: #f0fdf4; font-weight: bold; font-size: 8px; }
    .cell.fog { background: var(--fog); border: none; pointer-events: none; }
    .type-energy { color: var(--accent); background: #e6f0ff; }
    .type-drain { color: var(--danger); background: #ffe8e9; }
    .type-trap { color: var(--danger); background: #ffe8e9; }
    .type-lore { color: var(--lore); background: #e0f7fa; font-weight: bold; }
    .type-bypass { color: var(--success); background: #e0f2e9; }
    .type-fail { background: #000; color: var(--danger); border: 2px solid var(--danger); }
    
    /* CONTROLS */
    .controls-wrapper { margin-top: 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .abort-btn { width: 100%; padding: 0.7rem; background: var(--surface); border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .abort-btn:active { background: var(--danger); color: white; }
    .d-pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; max-width: 200px; }
    .btn { background: var(--surface); border: 1px solid #dee2e6; color: var(--text); padding: 0.6rem; border-radius: 6px; cursor: pointer; font-family: var(--font); font-weight: 500; transition: 0.2s; text-align: center; }
    .btn:active { background: var(--accent); color: white; border-color: var(--accent); transform: scale(0.95); }
    .btn.danger { border-color: var(--danger); color: var(--danger); }

    /* LORE/UPGRADES */
    #lore-panel h3 { margin-bottom: 1rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; display: inline-block; }
    .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-top: 1rem; }
    .slot { border: 1px dashed #dee2e6; padding: 0.8rem; min-height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.8rem; border-radius: 8px; background: #f8f9fa; color: var(--text-dim); transition: 0.2s; }
    .slot.filled { border-style: solid; border-color: var(--accent); background: #e6f0ff; color: var(--accent); font-weight: bold; }
    .fragment-list { max-height: 200px; overflow-y: auto; margin-top: 1rem; border: 1px solid #e1e8ed; border-radius: 8px; padding: 0.5rem; }
    .fragment-item { padding: 0.6rem; border-bottom: 1px solid #f1f3f5; cursor: pointer; display: flex; justify-content: space-between; }
    .fragment-item:hover { background: var(--surface); color: var(--accent); }
    .tag { font-size: 0.7rem; background: #e9ecef; padding: 2px 6px; border-radius: 4px; }

    /* SETTINGS */
    .settings-screen { align-items: center; justify-content: center; gap: 1rem; }

    #terminal { height: 80px; background: var(--surface); border-top: 1px solid #e1e8ed; padding: 0.5rem; overflow-y: auto; font-size: 0.75rem; font-family: monospace; color: var(--text-dim); border-radius: 0 0 12px 12px; }
    .log { margin-bottom: 2px; } .log.info { color: var(--accent); } .log.warn { color: var(--danger); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--surface); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); padding: 1.5rem; max-width: 90vw; width: 320px; text-align: center; }
    .modal h3 { color: var(--accent); margin-bottom: 0.5rem; }
    .modal p { color: var(--text-dim); margin-bottom: 1.5rem; line-height: 1.4; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: center; }
  </style>
</head>
<body>
  <div id="app">
    <!-- DESKTOP -->
    <div id="desktop" class="screen active">
      <div id="desktop-stats">LVL <span id="desk-lvl">1</span> | ⚡ <span id="desk-energy">50</span>/<span id="desk-cap">50</span></div>
      <button class="settings-btn" onclick="App.openSettings()">⚙️ Settings</button>
      <h2 style="margin-bottom: 1rem; color: var(--text-dim); font-size: 0.8rem; letter-spacing: 1px;">SYSTEM OS v3.4</h2>
      <div class="icon" onclick="App.launchDecode()"><div class="icon-title">DECODE</div><div class="icon-label">Launch Archive</div></div>
      <div class="icon" onclick="App.openLore()"><div class="icon-title">UPGRADES</div><div class="icon-label">Slot Manager</div></div>
      <div class="icon" onclick="App.importSave()"><div class="icon-title">LOAD</div><div class="icon-label">Import Data</div></div>
      <div class="icon" onclick="App.exportSave()"><div class="icon-title">SAVE</div><div class="icon-label">Export Data</div></div>
    </div>

    <!-- GRID RUN -->
    <div id="grid-screen" class="screen">
      <div id="grid-header">
        <span>⚡ <span id="ui-energy">50</span></span>
        <span id="objective-tracker"></span>
        <span>📁 <span id="ui-lore">0</span></span>
      </div>
      <div id="grid-wrapper"><div id="grid-container"></div></div>
      <div class="controls-wrapper">
        <button class="abort-btn" onclick="App.abortRun()">ABORT RUN</button>
        <div class="d-pad">
          <div></div><button class="btn" onclick="App.move(0, -1)">▲</button><div></div>
          <button class="btn" onclick="App.move(-1, 0)">◀</button>
          <button class="btn" style="visibility:hidden">.</button>
          <button class="btn" onclick="App.move(1, 0)">▶</button>
          <div></div><button class="btn" onclick="App.move(0, 1)">▼</button><div></div>
        </div>
      </div>
    </div>

    <!-- LORE/UPGRADES -->
    <div id="lore-screen" class="screen">
      <h3>MODULE CONFIG</h3>
      <div class="slot-grid" id="slot-container"></div>
      <h4 style="margin: 1rem 0 0.5rem; color: var(--text-dim); font-size: 0.9rem;">AVAILABLE FRAGMENTS</h4>
      <div class="fragment-list" id="fragment-list"></div>
      <button class="btn" onclick="App.returnToDesktop()" style="margin-top: 1rem; width: 100%;">BACK TO DESKTOP</button>
    </div>

    <!-- SETTINGS -->
    <div id="settings-screen" class="screen settings-screen">
      <h3>SYSTEM SETTINGS</h3>
      <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; width: 100%;">
        <button class="btn danger" style="width: 100%;" onclick="App.resetProgress()">⚠️ RESET ALL PROGRESS</button>
        <button class="btn" style="width: 100%;" onclick="App.returnToDesktop()">BACK TO DESKTOP</button>
      </div>
    </div>
  </div>
  <div id="terminal"></div>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">DATA FRAGMENT</h3>
      <p id="modal-body"></p>
      <div id="modal-actions"></div>
    </div>
  </div>

<script>
const Utils = {
  mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  hash(data) { try { return btoa(JSON.stringify(data) + "ARCHIVE_SALT_v3"); } catch(e) { return ""; } },
  bfs(grid, start, end, size) {
    const q = [start], visited = new Set([`<LaTex>id_19</LaTex>{start.y}`]);
    while(q.length) {
      const {x, y} = q.shift();
      if(x===end.x && y===end.y) return true;
      for(const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
        const nx=x+dx, ny=y+dy, k=`<LaTex>id_18</LaTex>{ny}`;
        if(nx>=0 && nx<size && ny>=0 && ny<size && !visited.has(k) && grid[ny*size+nx]!=='wall') { visited.add(k); q.push({x:nx, y:ny}); }
      }
    } return false;
  },
  log(msg, type='sys') {
    const term = document.getElementById('terminal');
    const div = document.createElement('div'); div.className = `log <LaTex>id_17</LaTex>{msg}`;
    term.appendChild(div); term.scrollTop = term.scrollHeight;
  }
};

const State = {
  data: { level: 1, xp: 0, energy: 50, cap: 50, fragments: [], upgrades: [null, null, null], lastTick: Date.now(), runsCleared: 0, inRun: false },
  run: { grid: [], size: 4, px: 0, py: 0, exitX: 0, exitY: 0, visited: new Set(), fog: new Set(), triggered: new Set(), objectives: [], wallBypassCharges: 0, steps: 0, objLore: 0, objDrain: 0, objEnergy: 0 },
  save(key='archive_save_v3') {
    const raw = { data: this.data, ts: Date.now() };
    localStorage.setItem(key, JSON.stringify({ ...raw, hash: Utils.hash(raw.data) }));
  },
  load() {
    const raw = localStorage.getItem('archive_save_v3');
    if(!raw) return;
    try {
      const { data, hash } = JSON.parse(raw);
      if(Utils.hash(data) !== hash) { Utils.log("DATA CORRUPTED. USING DEFAULT.", "warn"); return; }
      this.data = { ...this.data, ...data };
      this.data.energy = Math.max(0, Math.min(this.data.energy, this.data.cap));
    } catch(e) {
      Utils.log("SAVE ERROR. USING DEFAULT.", "warn");
    }
  }
};

const Idle = {
  calc() {
    if(State.data.inRun) return;
    const elapsed = (Date.now() - State.data.lastTick) / 1000;
    if(elapsed < 5) return;
    const baseRate = 0.05;
    const boostRate = State.data.upgrades.includes('IDLE_BOOST') ? 1 : 0;
    const regen = Math.floor(elapsed * (baseRate + boostRate));
    State.data.energy = Math.min(State.data.cap, State.data.energy + regen);
    State.data.lastTick = Date.now();
    if(regen > 0) Utils.log(`IDLE SYNC: +<LaTex>id_16</LaTex>{target} cells`, 
          lore:`Collect <LaTex>id_15</LaTex>{target} Drains`, 
          energy:`Step on <LaTex>id_14</LaTex>{sz}x<LaTex>id_13</LaTex>{nx},<LaTex>id_12</LaTex>{o.desc[o.type]} [<LaTex>id_11</LaTex>{o.target}]`;
    el.style.color = done ? "#2a9d8f" : "#007bff";
  },
  render() {
    const cont = document.getElementById('grid-container');
    cont.innerHTML = '';
    cont.style.gridTemplateColumns = `repeat(<LaTex>id_10</LaTex>{x},<LaTex>id_9</LaTex>{type}`);
              el.textContent = icons[type];
            }
          } 
          // Unvisited but visible (fog of war around player)
          else {
            el.style.border = '1px dashed #ccc';
            if(icons[type]) {
              el.classList.add(`type-<LaTex>id_8</LaTex>{nx},<LaTex>id_7</LaTex>{State.run.wallBypassCharges} left]`, "info");
    } else if(cell === 'wall') {
      return;
    }
    
    if(!State.run.visited.has(key)) {
      State.data.energy = Math.max(0, State.data.energy - 1);
      State.run.steps++;
    }
    if(State.data.energy === 0) { App.endRun(false, "Energy depleted"); return; }
    
    State.run.px = nx; State.run.py = ny;
    State.run.visited.add(key);
    Grid.updateFog();
    this.applyCell(cell, key);
    Grid.render();
    
    if(nx===State.run.exitX && ny===State.run.exitY) {
      const objMet = State.run.objectives.length === 0 || State.run.objectives[0].progress >= State.run.objectives[0].target;
      objMet ? App.endRun(true, "Archive Decoded") : Utils.log("OBJECTIVE NOT MET", "warn");
    }
  },
  applyCell(type, key) {
    const isNew = !State.run.triggered.has(key);
    switch(type) {
      case 'energy':
        if(isNew) {
          const gain = 3 + Math.floor(State.data.level/3);
          State.data.energy = Math.min(State.data.cap, State.data.energy + gain);
          State.run.triggered.add(key);
          State.run.objEnergy++;
          Utils.log(`+<LaTex>id_6</LaTex>{target.name}\n<LaTex>id_5</LaTex>{frag.name}`, "info"); }
    else Utils.log("SLOTS FULL", "warn");
    UI.hideModal(); UI.renderSlots();
  }
};

const UI = {
  updateStats() {
    document.getElementById('ui-energy').textContent = State.data.energy;
    document.getElementById('desk-energy').textContent = State.data.energy;
    document.getElementById('desk-cap').textContent = State.data.cap;
    document.getElementById('desk-lvl').textContent = State.data.level;
    document.getElementById('ui-lore').textContent = State.data.fragments.length;
  },
  renderSlots() {
    const cont = document.getElementById('slot-container'); cont.innerHTML = '';
    State.data.upgrades.forEach((u, i) => {
      const el = document.createElement('div'); el.className = `slot <LaTex>id_4</LaTex>{i+1} [EMPTY]`;
      el.onclick = () => { if(u) { State.data.upgrades[i]=null; UI.renderSlots(); Utils.log(`SLOT <LaTex>id_3</LaTex>{f.name}</span><span class="tag"><LaTex>id_2</LaTex>{reason}. +<LaTex>id_1</LaTex>{energyReward}⚡`, "info");
    } else {
      Utils.log(reason, "warn");
    }
    State.save(); 
    this.returnToDesktop();
  },
  openLore() { 
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); 
    document.getElementById('lore-screen').classList.add('active'); 
    UI.renderSlots(); 
  },
  openSettings() {
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('settings-screen').classList.add('active');
  },
  resetProgress() {
    if(confirm("Are you sure? This will delete all progress!")) {
      localStorage.removeItem('archive_save_v3');
      State.data = { level: 1, xp: 0, energy: 50, cap: 50, fragments: [], upgrades: [null, null, null], lastTick: Date.now(), runsCleared: 0, inRun: false };
      Utils.log("PROGRESS RESET", "warn");
      this.returnToDesktop();
    }
  },
  returnToDesktop() { 
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); 
    document.getElementById('desktop').classList.add('active'); 
    UI.updateStats(); 
    State.save(); 
  },
  exportSave() { const json = JSON.stringify(State.data); navigator.clipboard.writeText(json).then(()=>Utils.log("SAVE COPIED", "info")); },
  importSave() { const input = prompt("PASTE SAVE JSON:"); if(!input) return; try { const d = JSON.parse(input); if(d.energy!==undefined) { State.data = {...State.data, ...d}; State.save(); Utils.log("SAVE IMPORTED", "info"); } } catch(e) { Utils.log("INVALID SAVE", "warn"); } }
};
window.onload = App.init;
window.onbeforeunload = () => { State.data.lastTick = Date.now(); State.save(); };
</script>
</body>
</html>
